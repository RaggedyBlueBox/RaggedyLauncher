# Test build: compiles and packages the launcher WITHOUT publishing a
# release, moving tags, or uploading to any store. Uploads the signed appx
# plus its SHA-256 as run artifacts for manual pickup (for example, an
# exe-swap onto a devkit). Safe to run from any branch via workflow_dispatch.
name: Test build (no publish)

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail if any target is skipped (StrictTargets)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: raggedy-test-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build test appx
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"

      - name: Export JDK 17 path
        shell: powershell
        run: |
          "JDK17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JAVA17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "JDK 17: $env:JAVA_HOME"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Export JDK 21 path
        shell: powershell
        run: |
          "JAVA21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JDK21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "JDK 21: $env:JAVA_HOME"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Clean generated outputs
        shell: powershell
        run: .\scripts\clean.ps1 -Apply

      - name: Restore Fabric remap cache
        id: cache-fabric-remap
        uses: actions/cache/restore@v5
        with:
          path: staging/cache/gameDir/.fabric/remappedJars
          key: fabric-remap-${{ runner.os }}-${{ hashFiles('scripts/config.ps1') }}

      - name: Restore loader installer cache
        id: cache-installers
        uses: actions/cache/restore@v5
        with:
          path: staging/cache/loader-installers
          key: loader-installers-${{ runner.os }}-${{ hashFiles('config/versions.tsv') }}
          restore-keys: |
            loader-installers-${{ runner.os }}-

      - name: Restore download manifest cache
        id: cache-manifests
        uses: actions/cache/restore@v5
        with:
          path: staging/cache/manifests
          key: manifests-${{ runner.os }}-${{ hashFiles('config/versions.tsv', 'scripts/new-download-manifest.ps1', 'scripts/common.ps1') }}
          restore-keys: |
            manifests-${{ runner.os }}-

      - name: Restore patched loader clients
        id: cache-prebuilt
        uses: actions/cache/restore@v5
        with:
          path: prebuilt
          key: prebuilt-${{ runner.os }}-${{ hashFiles('config/versions.tsv', 'scripts/prepare-forge-patched-client.ps1', 'scripts/gen-neoforge-artifacts.ps1') }}
          restore-keys: |
            prebuilt-${{ runner.os }}-

      - name: Prepare build cache
        shell: powershell
        run: .\scripts\setup.ps1

      - name: Build APPX (test, no publish)
        shell: powershell
        run: |
          if ("${{ inputs.strict }}" -eq "true") {
            .\build.ps1 -SkipStopAppProcesses -StrictTargets
          } else {
            .\build.ps1 -SkipStopAppProcesses
          }

      - name: Stage test asset
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $appx = Get-ChildItem output\*.appx | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $appx) { throw "No appx produced in output\\" }
          Copy-Item $appx.FullName dist\RaggedyLauncher-test.appx -Force
          $hash = Get-FileHash dist\RaggedyLauncher-test.appx -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  RaggedyLauncher-test.appx" | Set-Content -Path dist\RaggedyLauncher-test.sha256 -Encoding ascii
          Write-Host "Test appx: $($appx.Name) -> RaggedyLauncher-test.appx"

      - name: Verify permanent modpack support
        shell: powershell
        run: .\scripts\validate-modern-version-matrix.ps1 -AppxPath dist\RaggedyLauncher-test.appx

      - name: Upload test artifact
        uses: actions/upload-artifact@v6
        with:
          name: RaggedyLauncher-test
          path: |
            dist/RaggedyLauncher-test.appx
            dist/RaggedyLauncher-test.sha256
          if-no-files-found: error
