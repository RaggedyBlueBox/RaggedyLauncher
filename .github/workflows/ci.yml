name: independent-core-ci

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate UWP XML files
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ("src/host/uwp/RaggedyLauncher.vcxproj", "src/host/uwp/Package.appxmanifest", "src/host/uwp/App.xaml", "src/host/uwp/MainPage.xaml"):
              ET.parse(path)
          PY

      - name: Build and run tests
        run: |
          SOURCES=$(find src -name '*.cpp' -not -path 'src/host/*' -print)
          for test in tests/core/test_core.cpp tests/core/test_rewrite.cpp tests/core/test_full.cpp; do
            name=$(basename "$test" .cpp)
            clang++ -std=c++20 -Wall -Wextra -pedantic -Iinclude "$test" $SOURCES -o "/tmp/$name"
            "/tmp/$name"
          done
